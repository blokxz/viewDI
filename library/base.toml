# Built-in library entries. Format: internal/catalog.

[[entry]]
id = "alpine"
name = "Alpine 3.21"
category = "Base images"
description = "Minimal Linux image."
engine = "docker"
image = "alpine:3.21"
docs = "https://hub.docker.com/_/alpine"
restart = "no"
note = """
This image has no long-running process, so it stops right away. Use it as a base, or run a shell with: docker run -it alpine:3.21
"""

