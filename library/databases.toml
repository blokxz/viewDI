# Built-in library entries. Format: internal/catalog.

[[entry]]
id = "postgres"
name = "PostgreSQL 17"
category = "Databases"
description = "Relational database, the official image."
engine = "docker"
image = "postgres:17"
docs = "https://hub.docker.com/_/postgres"
restart = "unless-stopped"
note = """
Connect with: psql -h localhost -p {{port 5432}} -U postgres
The generated password is in the container environment (Inspect, v to reveal).
"""
[[entry.ports]]
container = 5432
[[entry.env]]
name = "POSTGRES_PASSWORD"
generate = "password"
required = true
description = "Superuser password"
[[entry.env]]
name = "POSTGRES_USER"
value = "postgres"
[[entry.volumes]]
name = "data"
path = "/var/lib/postgresql/data"

[[entry]]
id = "mysql"
name = "MySQL 8.4"
category = "Databases"
description = "MySQL long-term support release."
engine = "docker"
image = "mysql:8.4"
docs = "https://hub.docker.com/_/mysql"
restart = "unless-stopped"
note = """
Connect with: mysql -h 127.0.0.1 -P {{port 3306}} -u root -p
"""
[[entry.ports]]
container = 3306
[[entry.env]]
name = "MYSQL_ROOT_PASSWORD"
generate = "password"
required = true
description = "Root password"
[[entry.volumes]]
name = "data"
path = "/var/lib/mysql"

