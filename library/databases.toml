description = "Distributed memory cache."
engine = "docker"
image = "memcached:1.6"
docs = "https://hub.docker.com/_/memcached"
restart = "unless-stopped"
note = """
Listening on host port {{port 11211}}. It has no authentication.
"""
[[entry.ports]]
container = 11211
