[[entry]]
id = "redis"
name = "Redis 7"
category = "Databases"
description = "In-memory data store."
engine = "docker"
image = "redis:7"
docs = "https://hub.docker.com/_/redis"
restart = "unless-stopped"
note = """
Connect with: redis-cli -p {{port 6379}}
There is no password: do not publish this port beyond your own machine.
"""
[[entry.ports]]
container = 6379
[[entry.volumes]]
name = "data"
path = "/data"

[[entry]]
id = "mongo"
name = "MongoDB 8"
category = "Databases"
description = "Document database."
engine = "docker"
image = "mongo:8"
docs = "https://hub.docker.com/_/mongo"
restart = "unless-stopped"
note = """
Connect with: mongosh --port {{port 27017}} -u admin
"""
[[entry.ports]]
container = 27017
[[entry.env]]
name = "MONGO_INITDB_ROOT_USERNAME"
value = "admin"
[[entry.env]]
name = "MONGO_INITDB_ROOT_PASSWORD"
generate = "password"
required = true
description = "Root password"
[[entry.volumes]]
name = "data"
path = "/data/db"

[[entry]]
id = "memcached"
