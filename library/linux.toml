[[entry]]
id = "debian-12-docker"
name = "Debian 12 + Docker"
category = "Linux systems"
description = "Debian with Docker installed on first boot (cloud-init)."
engine = "incus"
image = "images:debian/12/cloud"
docs = "https://docs.docker.com/engine/"
kinds = ["container", "vm"]
default_kind = "container"
memory = "2GiB"
note = """
Docker is installed by cloud-init on the first boot; wait a minute or two, then:
incus exec {{name}} -- docker ps
Check progress with: incus exec {{name}} -- cloud-init status
"""
cloud_init = """
#cloud-config
package_update: true
packages:
  - docker.io
runcmd:
  - systemctl enable --now docker
"""
[entry.config]
"security.nesting" = "true"

[[entry]]
id = "ubuntu-24-04-k3s"
name = "Ubuntu 24.04 + k3s"
category = "Linux systems"
description = "A single-node Kubernetes (k3s) installed on first boot."
engine = "incus"
image = "images:ubuntu/24.04/cloud"
docs = "https://docs.k3s.io/"
kinds = ["vm"]
default_kind = "vm"
cpu = 2
memory = "4GiB"
note = """
k3s is installed by cloud-init on the first boot, which downloads it from get.k3s.io; wait a few minutes, then:
incus exec {{name}} -- k3s kubectl get nodes
"""
cloud_init = """
#cloud-config
package_update: true
runcmd:
  - curl -sfL https://get.k3s.io | sh -
"""
