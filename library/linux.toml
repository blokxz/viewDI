# Built-in Incus entries: system images from the images: remote.
# Format: internal/catalog. cloud_init needs an alias ending in /cloud.

[[entry]]
id = "debian-12"
name = "Debian 12"
category = "Linux systems"
description = "Debian stable as a system container or a VM."
engine = "incus"
image = "images:debian/12"
docs = "https://images.linuxcontainers.org/"
kinds = ["container", "vm"]
default_kind = "container"
note = "Enter it with: incus exec {{name}} -- bash"

[[entry]]
id = "ubuntu-24-04"
name = "Ubuntu 24.04 LTS"
category = "Linux systems"
description = "Ubuntu long-term support as a system container or a VM."
engine = "incus"
image = "images:ubuntu/24.04"
docs = "https://images.linuxcontainers.org/"
kinds = ["container", "vm"]
default_kind = "container"
note = "Enter it with: incus exec {{name}} -- bash"

