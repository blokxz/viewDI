name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a vulnerability, do **not** open an issue: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: viewDI version
      description: Output of `viewdi --version`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options: [".deb", ".rpm", "tarball", "AUR", "source"]
    validations:
      required: true
  - type: input
    id: engines
    attributes:
      label: Engines and versions
      description: "`docker version --format '{{.Server.Version}}'` and `incus --version`"
      placeholder: "Docker 29.1.0, Incus 6.7"
    validations:
      required: true
  - type: dropdown
    id: socket
    attributes:
      label: Socket type
      options:
        - Docker rootful
        - Docker rootless
        - Docker over TCP or SSH
        - Incus unix.socket (incus-admin)
        - Incus unix.socket.user (restricted)
        - "--mock"
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal and $TERM
      placeholder: "kitty, xterm-kitty, 120x40"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it also happens with `viewdi --mock=<scenario>`, say which scenario.
  - type: textarea
    id: attachments
    attributes:
      label: Logs
      description: |
        A `crash-*.log` from ~/.local/state/viewDI/, the output of `viewdi --debug` (viewdi.log) or a
        `--trace` file. Review them first; the crash report holds no key presses, but logs can name your containers.
